[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravity-lab"
version = "0.2.0"
description = "Python APIs for faithful classic and lightweight motorcycle RL environments"
requires-python = ">=3.10"
license = {text = "GPL-2.0-only"}

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
