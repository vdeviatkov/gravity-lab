[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravity-lab"
version = "0.3.0"
description = "Cross-language motorcycle RL environments and portable dense-policy playback"
requires-python = ">=3.10"
license = {text = "GPL-2.0-only"}

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
