name: ci

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure
        run: cmake -S . -B build -DGRAVITY_LAB_BUILD_DESKTOP=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: C++ tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Python tests (Unix)
        if: runner.os != 'Windows'
        run: PYTHONPATH=python python -m unittest discover -s tests/python -v
      - name: Python tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = "python"
          python -m unittest discover -s tests/python -v

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev
      - name: Build RL sandbox viewer
        run: cmake -S . -B build && cmake --build build --config Release --target gravity_lab_sandbox
      - name: Build faithful classic game
        run: cmake -S classic -B build-classic && cmake --build build-classic --config Release --target GravityDefied
